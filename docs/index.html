  <h2>美元流动性：价格层 vs 数量层</h2>
  <p class="sub">上面两幅是价格/预期层（实际利率、美元指数），最下面是数量层（美联储净流动性）。三幅共用时间轴，悬停可同时查看。阴影是美联储扩表（QE）和缩表（QT）的时期。</p>
  <div class="card">
    <svg id="liq" tabindex="0" role="img" aria-label="10 年期实际利率、美元指数、美联储净流动性分面图"></svg>
    <div class="tip" id="tip2"></div>
  </div>
  <p class="sub" style="margin-top:16px">拆解：两条恒等式把变化拆到各个来源。实际利率的变化 = 名义收益率的变化 + (−通胀预期的变化)；净流动性的变化 = 总资产（美联储） + (−TGA，财政部) + (−逆回购，货币市场)。哪一项贡献最大，就说明是哪一类因素在起作用。</p>
  <div class="card">

  for (const m of sets) {

    for (let e = Math.floor(Math.log10(lo)) - 1; e <= Math.ceil(Math.log10(hi)); e++)

function lagReading(rows, thr) {
  const [top, bot] = lagExtremes(rows);
  if (!rows.some(r => Math.abs(r.r) >= thr)) return "所选区间内，所有错位的相关系数都没有超过粗略显著门槛，看不出稳定的先后关系。";
  return `所选区间内：最强正相关在「${lagText(top.k)}」（${top.r >= 0 ? "+" : ""}${top.r.toFixed(2)}），最强负相关在「${lagText(bot.k)}」（${bot.r.toFixed(2)}）。` +
    [top, bot].filter(r => Math.abs(r.r) >= thr).map(r => `${lagText(r.k)}：${lagMeaning(r.k, r.r)}。`).join("") +
    "颜色较淡的柱子没有超过门槛。相关只说明时间上谁先动，不等于因果。";
}

const state = { years: 20, scale: "log" };


function render() {
  const svg = $("chart");
  svg.textContent = "";
  const W = svg.clientWidth || 900;
  const H = Math.max(320, Math.min(560, Math.round(W * 0.5)));
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  const M = { t: 12, r: 132, b: 28, l: 48 };
  const iw = W - M.l - M.r, ih = H - M.t - M.b;

  const [i0, i1] = sliceIdx(state.years);
  const ser = indexed(i0, i1);
  const xs = dates.slice(i0, i1 + 1);
  const isLog = state.scale === "log";

  let lo = Infinity, hi = -Infinity;
  for (const s of ser) for (const v of s.idx) if (v != null && (!isLog || v > 0)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
  lo = Math.min(lo, 100); hi = Math.max(hi, 100);
  if (isLog) { lo /= 1.06; hi *= 1.06; }
  else { const pad = (hi - lo) * 0.05; lo = Math.max(0, lo - pad); hi += pad; }

  const t0 = xs[0].getTime(), t1 = xs[xs.length - 1].getTime();
  const X = d => M.l + (d.getTime() - t0) / (t1 - t0) * iw;
  const Y = isLog
    ? v => M.t + (1 - (Math.log(v) - Math.log(lo)) / (Math.log(hi) - Math.log(lo))) * ih
    : v => M.t + (1 - (v - lo) / (hi - lo)) * ih;

  // 网格 + Y 轴刻度
  const gy = el("g", { class: "tick" }, svg);
  for (const v of (isLog ? logTicks(lo, hi) : linTicks(lo, hi))) {
    const y = Y(v);
    el("line", { x1: M.l, x2: M.l + iw, y1: y, y2: y, stroke: "var(--grid)", "stroke-width": 1 }, gy);
    const t = el("text", { x: M.l - 8, y: y + 4, "text-anchor": "end" }, gy);
    t.textContent = v >= 1000 ? v.toLocaleString("en-US") : String(+v.toFixed(1));
  }
  // 100 基准线
  el("line", { x1: M.l, x2: M.l + iw, y1: Y(100), y2: Y(100), stroke: "var(--axis)", "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);

  // X 轴刻度
  const gx = el("g", { class: "tick" }, svg);
  el("line", { x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih, stroke: "var(--axis)", "stroke-width": 1 }, gx);
  const spanYears = (t1 - t0) / 3.156e10;
  if (spanYears > 1.5) {
    const every = spanYears > 12 ? 2 : 1;
    for (let y = xs[0].getFullYear() + 1; y <= xs[xs.length - 1].getFullYear(); y++) {
      if (y % every) continue;
      const x = X(new Date(y, 0, 1));
      const t = el("text", { x, y: H - 8, "text-anchor": "middle" }, gx);
      t.textContent = String(y);
    }
  } else {
    const d = new Date(xs[0].getFullYear(), xs[0].getMonth() + 1, 1);
    for (; d <= xs[xs.length - 1]; d.setMonth(d.getMonth() + 2)) {
      const t = el("text", { x: X(d), y: H - 8, "text-anchor": "middle" }, gx);
      t.textContent = `${d.getFullYear() % 100}/${d.getMonth() + 1}`;
    }
  }

  // 折线
  for (const s of ser) {
    let d = "", pen = false;
    s.idx.forEach((v, i) => {
      if (v == null || (isLog && v <= 0)) { pen = false; return; }
      d += (pen ? "L" : "M") + X(xs[i]).toFixed(1) + "," + Y(v).toFixed(1);
      pen = true;
    });
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }

  // 末端直接标注（按 y 排序后推开避免重叠）
  const ends = ser.map(s => {
    const v = s.idx[s.idx.length - 1];
    return { s, v, y: Y(v), x: X(xs[xs.length - 1]) };
  }).sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => e.ly = Math.max(e.y, i ? ends[i - 1].ly + 32 : M.t + 10));
  const over = ends[ends.length - 1].ly - (M.t + ih - 14);
  if (over > 0) ends.forEach(e => e.ly -= over);
  for (const e of ends) {
    el("circle", { cx: e.x, cy: e.y, r: 4, fill: e.s.color, stroke: "var(--surface-1)", "stroke-width": 2 }, svg);
    const t1n = el("text", { x: e.x + 10, y: e.ly - 2, fill: "var(--text-primary)", "font-size": 12, "font-weight": 600 }, svg);
    t1n.textContent = e.s.name.replace("10 年期美债收益率", "10Y 美债");
    const t2n = el("text", { x: e.x + 10, y: e.ly + 13, fill: "var(--text-secondary)", "font-size": 12 }, svg);
    t2n.textContent = `${e.v.toFixed(0)}（${pct(e.v / 100 - 1)}）`;
  }

  // 悬停层
  const cross = el("line", { y1: M.t, y2: M.t + ih, stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = ser.map(s => el("circle", { r: 4, fill: s.color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg));
  const hit = el("rect", { x: M.l, y: M.t, width: iw, height: ih, fill: "transparent" }, svg);

  const tip = $("tip");
  function show(k) {
    if (k == null) { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); tip.style.display = "none"; return; }
      const x = X(xs[k]);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    h("div", { className: "d", textContent: fmtDate(xs[k]) }, tip);
    ser.forEach((s, j) => {
      const v = s.idx[k], raw = DATA[s.key][i0 + k];
      if (v != null && (!isLog || v > 0)) { dots[j].setAttribute("cx", x); dots[j].setAttribute("cy", Y(v)); dots[j].setAttribute("visibility", "visible"); }
      else dots[j].setAttribute("visibility", "hidden");
      const row = h("div", { className: "row" }, tip);
      h("i", {}, row).style.background = s.color;
      h("b", { textContent: raw == null ? "—" : s.fmt(raw) + (s.unit === "%" ? "%" : "") }, row);
      h("em", { textContent: s.name }, row);
      if (v != null) h("small", { textContent: `指数 ${v.toFixed(1)}（${pct(v / 100 - 1)}）` }, row);
    });
    placeTip(tip, svg, W, x, M.t);
  }
  bindHover(svg, hit, W, M.l, iw, xs, show);

  renderTiles(i0, i1);
  renderLiq(i0, i1);
  renderDecomp(i0, i1);
  renderLag(i0, i1);
  $("title").textContent = `过去 ${state.years} 年：黄金 · 原油 · 10 年期美债收益率`;
  document.title = $("title").textContent;
  $("sub").textContent =
    `${fmtDate(xs[0])} 至 ${fmtDate(xs[xs.length - 1])}，每 15 天一个采样点。三条线以区间起点 = 100 作指数化，放在同一纵轴上比较涨跌幅；悬停查看实际价格与收益率。`;
}

// 提示框定位：在十字线右侧，放不下就翻到左侧
function placeTip(tip, svg, W, x, top) {
  tip.style.display = "block";
  const card = svg.parentElement, sr = svg.getBoundingClientRect(), cr = card.getBoundingClientRect();
  const scale = sr.width / W, px = sr.left - cr.left + x * scale, tw = tip.offsetWidth;
  tip.style.left = (px + 16 + tw > card.clientWidth ? px - 16 - tw : px + 16) + "px";
  tip.style.top = (sr.top - cr.top + top * scale + 8) + "px";
}

// 十字线吸附到最近的采样点；键盘左右键逐点移动
function bindHover(svg, hit, W, x0, iw, xs, show) {
  let cur = null;
  const t0 = xs[0].getTime(), t1 = xs[xs.length - 1].getTime();
  const nearest = evt => {
    const r = svg.getBoundingClientRect();
    const t = t0 + ((evt.clientX - r.left) * W / r.width - x0) / iw * (t1 - t0);
    let best = 0, bd = Infinity;
    xs.forEach((d, i) => { const dd = Math.abs(d.getTime() - t); if (dd < bd) { bd = dd; best = i; } });
    return best;
  };
  const go = k => { cur = k; show(k); };
  hit.addEventListener("pointermove", e => go(nearest(e)));
  hit.addEventListener("pointerleave", () => go(null));
  svg.onkeydown = e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    const k = cur == null ? xs.length - 1 : cur + (e.key === "ArrowRight" ? 1 : -1);
    go(Math.max(0, Math.min(xs.length - 1, k)));
  };
  svg.onblur = () => go(null);
}

function xAxis(svg, xs, X, y, H) {
  const g = el("g", { class: "tick" }, svg);
  const t0 = xs[0].getTime(), t1 = xs[xs.length - 1].getTime();
  const spanYears = (t1 - t0) / 3.156e10;
  if (spanYears > 1.5) {
    const every = spanYears > 12 ? 2 : 1;
    for (let yy = xs[0].getFullYear() + 1; yy <= xs[xs.length - 1].getFullYear(); yy++) {
      if (yy % every) continue;
      el("text", { x: X(new Date(yy, 0, 1)), y, "text-anchor": "middle" }, g).textContent = String(yy);
    }
  } else {
    const d = new Date(xs[0].getFullYear(), xs[0].getMonth() + 1, 1);
    for (; d <= xs[xs.length - 1]; d.setMonth(d.getMonth() + 2))
      el("text", { x: X(d), y, "text-anchor": "middle" }, g).textContent = `${d.getFullYear() % 100}/${d.getMonth() + 1}`;
  }
}

// 共用时间轴的分面图：每幅一个 y 轴，悬停时所有分面一起读数
function renderPanels(svgId, tipId, SPEC, i0, i1, footer) {
  const val = (l, i) => l.f ? l.f(i, i0) : DATA[l.key][i];
  const svg = $(svgId);
  svg.textContent = "";
  const W = svg.clientWidth || 900;
  const M = { l: 48, r: 24 }, iw = W - M.l - M.r;
  const PH = 130, GAP = 56, TOP = 50;
  const H = TOP + SPEC.length * PH + (SPEC.length - 1) * GAP + 28;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  const xs = dates.slice(i0, i1 + 1);
  const t0 = xs[0].getTime(), t1 = xs[xs.length - 1].getTime();
  const X = d => M.l + (d.getTime() - t0) / (t1 - t0) * iw;
  const top0 = TOP, bottom = TOP + SPEC.length * PH + (SPEC.length - 1) * GAP;

  // QE / QT 阴影带，贯穿三幅
  for (const [n, a, b] of EPISODES) {
    if (b < xs[0] || a > xs[xs.length - 1]) continue;
    const xa = X(a < xs[0] ? xs[0] : a), xb = X(b > xs[xs.length - 1] ? xs[xs.length - 1] : b);
    el("rect", { x: xa, y: top0 - 16, width: Math.max(0, xb - xa), height: bottom - top0 + 16, fill: "var(--wash)" }, svg);
    if (xb - xa > 24) el("text", { x: xa + 4, y: top0 - 4, class: "band-label" }, svg).textContent = n;
  }

  const panels = SPEC.map((p, j) => {
    const y0 = TOP + j * (PH + GAP);
    let lo = Infinity, hi = -Infinity;
    for (const l of p.lines) for (let i = i0; i <= i1; i++) { const v = val(l, i); if (v != null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
    if (p.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    const pad = (hi - lo) * 0.08 || 1; lo -= pad; hi += pad;
    const Y = v => y0 + (1 - (v - lo) / (hi - lo)) * PH;
    // 标题 + 图例
    const tt = el("text", { x: M.l, y: y0 - 24, class: "panel-title" }, svg);
    tt.textContent = p.title;
    if (p.lines.length > 1) {
      let lx = M.l + tt.getComputedTextLength() + 20, ly = y0 - 24;
      for (const l of p.lines) {
        const kt = el("text", { class: "panel-key" }, svg);
        kt.textContent = l.name;
        const kw = kt.getComputedTextLength();
        if (lx + 22 + kw > W - M.r) { lx = M.l; ly += 16; } // 放不下就换行
        el("line", { x1: lx, x2: lx + 16, y1: ly - 4, y2: ly - 4, stroke: l.color, "stroke-width": 2, "stroke-dasharray": l.dash || "none" }, svg);
        kt.setAttribute("x", lx + 22); kt.setAttribute("y", ly);
        lx += 22 + kw + 18;
      }
    }
    const g = el("g", { class: "tick" }, svg);
    for (const v of linTicks(lo, hi).filter((_, i, a) => a.length <= 5 || i % 2 === 0)) {
      el("line", { x1: M.l, x2: M.l + iw, y1: Y(v), y2: Y(v), stroke: "var(--grid)", "stroke-width": 1 }, g);
      el("text", { x: M.l - 8, y: Y(v) + 4, "text-anchor": "end" }, g).textContent = String(+v.toFixed(2));
    }
    if (p.zero && lo < 0) el("line", { x1: M.l, x2: M.l + iw, y1: Y(0), y2: Y(0), stroke: "var(--axis)", "stroke-width": 1 }, svg);
    for (const l of p.lines) {
      let d = "";
      for (let i = i0; i <= i1; i++) { const v = val(l, i); if (v != null) d += (d ? "L" : "M") + X(dates[i]).toFixed(1) + "," + Y(v).toFixed(1); }
      el("path", { d, fill: "none", stroke: l.color, "stroke-width": l.w || (l.dash ? 1.5 : 2), "stroke-dasharray": l.dash || "none", "stroke-linejoin": "round" }, svg);
    }
    return { p, Y };
  });
  xAxis(svg, xs, X, H - 8);
  el("line", { x1: M.l, x2: M.l + iw, y1: bottom, y2: bottom, stroke: "var(--axis)", "stroke-width": 1 }, svg);

  const cross = el("line", { y1: top0, y2: bottom, stroke: "var(--text-muted)", "stroke-width": 1, visibility: "hidden" }, svg);
  const dots = panels.flatMap(({ p }) => p.lines.map(l => el("circle", { r: 4, fill: l.color, stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" }, svg)));
  const hit = el("rect", { x: M.l, y: top0, width: iw, height: bottom - top0, fill: "transparent" }, svg);
  const tip = $(tipId);
  bindHover(svg, hit, W, M.l, iw, xs, k => {
    if (k == null) { cross.setAttribute("visibility", "hidden"); dots.forEach(d => d.setAttribute("visibility", "hidden")); tip.style.display = "none"; return; }
    const i = i0 + k, x = X(xs[k]);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", "visible");
    tip.textContent = "";
    h("div", { className: "d", textContent: fmtDate(xs[k]) }, tip);
    let di = 0;
    for (const { p, Y } of panels) for (const l of p.lines) {
      const v = val(l, i), dot = dots[di++];
      if (v != null) { dot.setAttribute("cx", x); dot.setAttribute("cy", Y(v)); dot.setAttribute("visibility", "visible"); }
      const row = h("div", { className: "row" }, tip);
      h("i", {}, row).style.background = l.color;
      h("b", { textContent: v == null ? "—" : l.fmt(v) }, row);
      h("em", { textContent: l.name }, row);
    }
    footer(tip, i);
    placeTip(tip, svg, W, x, top0);
  });
}

function renderLag(i0, i1) {
  const svg = $("lag");
  svg.textContent = "";
  const W = svg.clientWidth || 900, H = 280;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("height", H);
  const M = { t: 40, r: 24, b: 44, l: 48 }, iw = W - M.l - M.r, ih = H - M.t - M.b;
  el("text", { x: M.l, y: 18, class: "panel-title" }, svg).textContent =
    "领先滞后相关：净流动性 90 天变化 vs 实际利率 90 天变化";
  const { rows, n } = lagRows(i0, i1);
  const reading = $("reading");
  if (n < 40) {
    el("text", { x: M.l, y: M.t + 40, class: "panel-key" }, svg).textContent = "所选区间太短（少于约 2 年），相关系数不可靠，请选 3 年以上的区间。";
    reading.textContent = "";
    return;
  }
  const thr = lagThreshold(n);
  const ext = Math.max(0.3, Math.ceil(Math.max(thr, ...rows.map(r => Math.abs(r.r))) * 10 + 0.5) / 10);
  const Y = v => M.t + (1 - (v + ext) / (2 * ext)) * ih;
  const bw = iw / rows.length, X = j => M.l + j * bw;

  const g = el("g", { class: "tick" }, svg);
  for (const v of linTicks(-ext, ext)) {
    el("line", { x1: M.l, x2: M.l + iw, y1: Y(v), y2: Y(v), stroke: v === 0 ? "var(--axis)" : "var(--grid)", "stroke-width": 1 }, g);
    el("text", { x: M.l - 8, y: Y(v) + 4, "text-anchor": "end" }, g).textContent = (v > 0 ? "+" : "") + +v.toFixed(2);
  }
  for (const s of [thr, -thr]) el("line", { x1: M.l, x2: M.l + iw, y1: Y(s), y2: Y(s), stroke: "var(--text-muted)", "stroke-width": 1, "stroke-dasharray": "4 4" }, svg);
  el("text", { x: M.l + iw, y: Y(thr) - 4, "text-anchor": "end", class: "band-label" }, svg).textContent = `粗略显著门槛 ±${thr.toFixed(2)}`;

  rows.forEach((r, j) => {
    const y = Y(Math.max(0, r.r)), hgt = Math.abs(Y(r.r) - Y(0));
    el("rect", { x: X(j) + 3, y, width: Math.max(1, bw - 6), height: Math.max(1, hgt), rx: 2,
      fill: "var(--s-real)", "fill-opacity": Math.abs(r.r) >= thr ? 1 : 0.35 }, svg);
    if (r.k % 2 === 0) el("text", { x: X(j) + bw / 2, y: H - 26, "text-anchor": "middle", class: "band-label" }, svg).textContent = r.k === 0 ? "0" : `${r.k > 0 ? "+" : "−"}${Math.abs(r.k) * 15}天`;
  });
  el("text", { x: M.l, y: H - 6, class: "panel-key" }, svg).textContent = "← 实际利率领先";
  el("text", { x: M.l + iw, y: H - 6, "text-anchor": "end", class: "panel-key" }, svg).textContent = "流动性领先 →";

  // 只标注最强的正、负两根柱
  const [top, bot] = lagExtremes(rows);
  for (const r of [top, bot].filter(r => Math.abs(r.r) >= 0.1)) {
    const j = rows.indexOf(r);
    el("text", { x: X(j) + bw / 2, y: r.r >= 0 ? Y(r.r) - 6 : Y(r.r) + 14, "text-anchor": "middle", fill: "var(--text-primary)", "font-size": 12, "font-weight": 600 }, svg)
      .textContent = (r.r > 0 ? "+" : "") + r.r.toFixed(2);
  }

  const tip = $("tip3");
  const hl = el("rect", { y: M.t, height: ih, width: bw, fill: "var(--wash)", visibility: "hidden" }, svg);
  svg.insertBefore(hl, svg.firstChild);
  const show = j => {
    if (j == null) { hl.setAttribute("visibility", "hidden"); tip.style.display = "none"; return; }
    const r = rows[j];
    hl.setAttribute("x", X(j)); hl.setAttribute("visibility", "visible");
    tip.textContent = "";
    h("div", { className: "d", textContent: lagText(r.k) }, tip);
    const row = h("div", { className: "row" }, tip);
    h("i", {}, row).style.background = "var(--s-real)";
    h("b", { textContent: (r.r > 0 ? "+" : "") + r.r.toFixed(2) }, row);
    h("em", { textContent: `相关系数（样本 ${r.n}）` }, row);
    h("div", { className: "grp", textContent: Math.abs(r.r) >= thr ? lagMeaning(r.k, r.r) : "未超过粗略显著门槛" }, tip);
    placeTip(tip, svg, W, X(j) + bw, M.t);
  };
  rows.forEach((r, j) => {
    const hit = el("rect", { x: X(j), y: M.t, width: bw, height: ih, fill: "transparent" }, svg);
    hit.addEventListener("pointerenter", () => show(j));
    hit.addEventListener("pointerleave", () => show(null));
  });
  let cur = null;
  svg.onkeydown = e => {
    if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
    e.preventDefault();
    cur = cur == null ? LAG_MAX : Math.max(0, Math.min(rows.length - 1, cur + (e.key === "ArrowRight" ? 1 : -1)));
    show(cur);
  };
  svg.onblur = () => { cur = null; show(null); };

  reading.textContent = lagReading(rows, thr);
}

function renderTiles(i0, i1) {
  const box = $("tiles");
  box.textContent = "";
  for (const s of SERIES) {
    const raw = DATA[s.key];
    let a = null; for (let i = i0; i <= i1; i++) if (raw[i] != null) { a = raw[i]; break; }
    const b = raw[i1];
    const tile = h("div", { className: "tile" }, box);
    const nm = h("div", { className: "name" }, tile);
    h("i", { className: "key" }, nm).style.background = s.color;
    nm.appendChild(document.createTextNode(s.name));
    const val = h("div", { className: "val", textContent: s.fmt(b) }, tile);
    h("span", { className: "unit", textContent: s.unit }, val);
    const chg = h("div", { className: "chg" }, tile);
    if (s.unit === "%") {
      const bp = Math.round((b - a) * 100);
      h("b", { className: bp >= 0 ? "up" : "down", textContent: (bp >= 0 ? "▲ +" : "▼ ") + bp + " 个基点" }, chg);
    } else {
      const r = b / a - 1;
      h("b", { className: r >= 0 ? "up" : "down", textContent: (r >= 0 ? "▲ " : "▼ ") + pct(r) }, chg);
    }
    chg.appendChild(document.createTextNode(`　区间起点 ${s.fmt(a)}　· 数据截至 ${DATA.asof[s.key]}`));
  }
}

function seg(id, items, get, set) {
  const box = $(id);
  for (const [label, v] of items) {
    const b = h("button", { type: "button", textContent: label }, box);
    b.setAttribute("aria-pressed", String(get() === v));
    b.onclick = () => { set(v); [...box.children].forEach(c => c.setAttribute("aria-pressed", String(c === b))); render(); };
  }
}

seg("range", RANGES, () => state.years, v => state.years = v);
seg("scale", SCALES, () => state.scale, v => state.scale = v);
const lg = $("legend");
for (const s of SERIES) { const sp = h("span", {}, lg); h("i", {}, sp).style.background = s.color; sp.appendChild(document.createTextNode(`${s.name}（${s.unit}）`)); }
renderNote();
if (matchMedia("(max-width: 700px)").matches) $("mhint").hidden = false;
renderTable();
render();
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 100); });
</script>
</body>
</html>
